name: Import source archive

# Unpacks MemoraCloud-source.zip at the repository root and commits it.
#
# Why the original failed: GitHub's built-in token is never allowed to create or change
# files under .github/workflows/, and the archive contains them, so the final push was rejected.
#
# - With a secret named WORKFLOW_PAT (a personal access token that has workflow permission),
#   everything is unpacked, including .github/, and this helper deletes itself.
# - Without it, .github/ is skipped (you add those files by hand) and the helper stays in place.
on:
  workflow_dispatch:
    inputs:
      archive:
        description: "Path to the uploaded .zip"
        required: false
        default: "MemoraCloud-source.zip"
      branch:
        description: "Branch to commit to"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    env:
      ARCHIVE: ${{ inputs.archive }}
      BRANCH: ${{ inputs.branch }}
      HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - name: Unpack the uploaded archive
        run: |
          set -euo pipefail
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error title=Archive not found::Upload $ARCHIVE to the repository root first."
            ls -1 || true
            exit 1
          fi
          if [ "$HAS_PAT" = "true" ]; then
            unzip -o -q "$ARCHIVE" -d .
            rm -f .github/workflows/unpack-source.yml
          else
            echo "::warning title=No WORKFLOW_PAT::Skipping .github/ (GitHub blocks workflow changes from the default token)."
            unzip -o -q "$ARCHIVE" -x ".github/*" -d .
          fi
          rm -f "$ARCHIVE"
          chmod +x gradlew
          echo "Unpacked $(find . -name '*.kt' -not -path './.git/*' | wc -l) Kotlin files."

      - name: Commit the project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: import Memora Cloud source"
          git push origin "HEAD:${BRANCH}"
