name: Memora

# Three runs, chosen from the dropdown when you press "Run workflow":
#   1) mode = keystore  -> creates your signing key, prints the 4 secret values
#   2) mode = release   -> builds the signed app (~25 MB) and publishes a GitHub Release
#   3) mode = build     -> optional: a throwaway test APK
#
# Everything is arm64 only, because that is what your phone uses.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "keystore, then release (or build for a test APK)"
        type: choice
        options: [release, keystore, build]
        default: release
      version:
        description: "Version for mode=release"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  keystore:
    name: Create signing key
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'keystore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Generate
        run: |
          set -euo pipefail
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          keytool -genkeypair -keystore memoracloud.jks -alias memoracloud -keyalg RSA -keysize 4096 \
            -validity 9125 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Memora Cloud, OU=Adnan, O=Memora Cloud, L=Dhaka, C=BD"
          base64 -w0 memoracloud.jks > memoracloud.jks.b64
          {
            echo "## Add these 4 secrets"
            echo ""
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo "| Name | Value |"
            echo "| --- | --- |"
            echo "| KEYSTORE | the long text in the collapsed block below |"
            echo "| KEYSTORE_PASSWORD | \`$PASS\` |"
            echo "| KEY_ALIAS | \`memoracloud\` |"
            echo "| KEY_PASSWORD | \`$PASS\` |"
            echo ""
            echo "<details><summary>KEYSTORE value</summary>"
            echo ""
            echo '```'
            cat memoracloud.jks.b64
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: memoracloud-keystore
          path: memoracloud.jks.b64
          retention-days: 1

  release:
    name: Signed app
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - name: Check the secrets
        env:
          K: ${{ secrets.KEYSTORE }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KW: ${{ secrets.KEY_PASSWORD }}
        run: |
          m=0
          [ -z "$K" ]  && { echo "::error::KEYSTORE secret missing - run mode=keystore first"; m=1; }
          [ -z "$KP" ] && { echo "::error::KEYSTORE_PASSWORD secret missing"; m=1; }
          [ -z "$KA" ] && { echo "::error::KEY_ALIAS secret missing"; m=1; }
          [ -z "$KW" ] && { echo "::error::KEY_PASSWORD secret missing"; m=1; }
          exit $m
      - name: Restore the key
        env:
          K: ${{ secrets.KEYSTORE }}
        run: echo "$K" | base64 -d > "$RUNNER_TEMP/keystore.jks"
      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew :android:assembleRelease
          -PappVersionName=${{ inputs.version }}
          -PappVersionCode=${{ github.run_number }}
      - name: Package the arm64 APK
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find android/build/outputs/apk/release -name "*-arm64-v8a-*.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::No arm64 APK produced"; ls -R android/build/outputs/apk | head -40; exit 1; }
          NAME="MemoraCloud-${{ inputs.version }}-arm64.apk"
          cp "$APK" "out/$NAME"
          SHA=$(sha256sum "out/$NAME" | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" "$NAME" > out/SHA256SUMS.txt
          printf '{"version":"%s","versionCode":%s,"apk":"%s","sha256":"%s","minSdk":26}\n' \
            "${{ inputs.version }}" "${{ github.run_number }}" "$NAME" "$SHA" > out/update.json
          ls -lh out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" out/*.apk out/SHA256SUMS.txt out/update.json \
            --title "Memora Cloud ${{ inputs.version }}" \
            --notes "Signed. arm64. Android 8.0+." --latest

  build:
    name: Test APK
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew :android:assembleDebug
      - run: |
          mkdir -p out
          find android/build/outputs/apk/debug -name "*-arm64-v8a-*.apk" -exec cp {} out/ \;
          ls -lh out
      - uses: actions/upload-artifact@v7
        with:
          name: MemoraCloud-test-arm64
          path: out/*.apk
          if-no-files-found: error
