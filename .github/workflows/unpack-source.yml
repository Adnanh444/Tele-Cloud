name: U
on: workflow_dispatch
permissions: {contents: write}
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: "unzip -q -o *.zip -d . && rm -f *.zip .github/workflows/unpack-source.yml && chmod +x gradlew && git config user.name bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -m import && git push"
