name: Sync
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          set -eu
          Z=$(ls *.zip 2>/dev/null | head -1) || true
          [ -n "$Z" ] || { echo "FAILED: put the source .zip at the repo root"; exit 1; }
          echo "found $Z"
          unzip -q -o "$Z" -d /tmp/s
          S=$(dirname "$(find /tmp/s -maxdepth 2 -name android -type d | head -1)")
          echo "source: $S"
          rsync -a --delete --exclude .git --exclude .github "$S"/ ./
          chmod +x gradlew || true
          git config user.name actions
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "sync Memora Cloud source" || echo "nothing to commit"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "DONE - repo mirrors the archive"
