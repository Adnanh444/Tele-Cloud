name: Sync
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          set -eu
          echo "step 1: looking for the archive"
          Z=$(ls *.zip 2>/dev/null | head -1) || true
          if [ -z "$Z" ]; then echo "FAILED: no .zip at the repo root"; exit 1; fi
          echo "found $Z"
          echo "step 2: unpacking"
          unzip -q -o "$Z" -d /tmp/s
          S=$(dirname "$(find /tmp/s -maxdepth 2 -name android -type d | head -1)")
          echo "source folder: $S"
          echo "step 3: copying into the repo"
          tar -C "$S" --exclude=.github -cf - . | tar -xf -
          rm -f "$Z"
          chmod +x gradlew
          echo "step 4: committing"
          git config user.name "actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "sync Memora Cloud source" || echo "nothing new to commit"
          echo "step 5: pushing"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "DONE - source is in main"
