name: Import source

# Unpacks MemoraCloud-source.zip from the repository root into the repository and commits it.
# Re-runnable: run it again after uploading a newer archive.
# It never touches .github/ (GitHub's token is not allowed to change workflow files), and it writes
# its result to the run's Summary page, so there is nothing to read in the log.
#
# Needs Settings -> Actions -> General -> Workflow permissions = "Read and write permissions".
on: workflow_dispatch

permissions:
  contents: write

jobs:
  import:
    name: Import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import
        run: |
          set -uo pipefail
          S="$GITHUB_STEP_SUMMARY"
          say() { echo "$1" >> "$S"; }
          say "## Import report"
          say ""
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -1)
          if [ -z "${ZIP:-}" ]; then
            say "- ❌ No .zip found at the repository root."
            say ""
            say "**Fix:** Code → *Add file → Upload files* → choose \`MemoraCloud-source.zip\` → Commit, then run this workflow again."
            exit 1
          fi
          say "- ✅ Archive: \`$ZIP\`"
          rm -rf /tmp/x && mkdir -p /tmp/x
          if ! unzip -q -o "$ZIP" -d /tmp/x; then
            say "- ❌ The archive could not be unzipped."
            exit 1
          fi
          SRC=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            SRC="/tmp/x/$(ls /tmp/x)"
          fi
          if [ ! -d "$SRC/android" ] || [ ! -d "$SRC/shared" ]; then
            say "- ❌ That archive has no \`android/\` and \`shared/\` folders."
            say ""
            say "**Fix:** upload the file named \`MemoraCloud-source.zip\`."
            exit 1
          fi
          say "- ✅ Unpacked ($(find "$SRC" -name '*.kt' | wc -l) Kotlin files)"
          tar -C "$SRC" --exclude=.github --exclude='*/build' -cf - . | tar -C . -xf -
          rm -f "$ZIP"
          chmod +x gradlew 2>/dev/null || true
          say "- ✅ Files copied over the repository (workflows left alone)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            say "- ℹ️ Nothing changed — the repository already matches this archive."
            exit 0
          fi
          git commit -q -m "chore: import Memora Cloud source"
          if PUSH=$(git push origin "HEAD:${{ github.event.repository.default_branch }}" 2>&1); then
            say "- ✅ Committed and pushed to main"
            say ""
